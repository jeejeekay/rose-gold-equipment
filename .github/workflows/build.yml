# Builds both loaders on every push. Results: GitHub repo -> "Actions" tab.
# Each Minecraft branch has its own copy of this file; only JAVA_VERSION differs.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one loader failing doesn't cancel the other
      matrix:
        loader: [neoforge, fabric]
    defaults:
      run:
        working-directory: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4   # caches Minecraft + dependencies between runs

      - name: Build (compile + jar)
        run: |
          chmod +x gradlew
          bash ../.github/scripts/gradle-run.sh "${{ matrix.loader }} build" build

      - name: Datagen
        run: |
          if [ "${{ matrix.loader }}" = "neoforge" ]; then t=runData; else t=runDatagen; fi
          bash ../.github/scripts/gradle-run.sh "${{ matrix.loader }} datagen" $t

      - name: Did datagen change anything?
        # Doesn't fail the build; lists generated files that differ from what's committed.
        run: |
          changed=$(git status --porcelain -- . | grep -v '/.cache/' || true)
          echo "$changed"
          if [ -n "$changed" ]; then echo "::notice title=${{ matrix.loader }} datagen changed files::$(echo "$changed" | awk '{printf "%s%%0A", $0}')"; fi

      - name: GameTests
        # Automated in-game tests, run headless.
        if: hashFiles(format('{0}/src/**/gametest/**', matrix.loader)) != ''
        run: |
          if [ "${{ matrix.loader }}" = "neoforge" ]; then t=runGameTestServer; else t=runGameTest; fi
          bash ../.github/scripts/gradle-run.sh "${{ matrix.loader }} gametests" $t

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosegoldequipment-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: ignore
