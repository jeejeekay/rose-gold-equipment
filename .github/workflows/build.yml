# Builds both loaders on every push. Results: GitHub repo -> "Actions" tab.
# Each Minecraft branch has its own copy of this file; only the Java versions differ.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    name: ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one loader failing doesn't cancel the other
      matrix:
        include:
          - loader: neoforge
            java: "25"
          - loader: fabric
            java: "25"
    defaults:
      run:
        working-directory: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4   # caches Minecraft + dependencies between runs

      - name: Build (compile + jar)
        run: |
          chmod +x gradlew
          bash ../.github/scripts/gradle-run.sh "${{ matrix.loader }} build" build

      - name: Datagen
        run: |
          if [ "${{ matrix.loader }}" = "neoforge" ]; then t=runData; else t=runDatagen; fi
          bash ../.github/scripts/gradle-run.sh "${{ matrix.loader }} datagen" $t

      - name: Did datagen change anything?
        # Doesn't fail the build; shows how generated files differ from what's committed.
        run: |
          git add -N . 2>/dev/null || true
          d=$(git diff -U0 -- . ':!**/.cache/**' | grep -vE '^(index|@@)' | head -120)
          echo "$d"
          if [ -n "$d" ]; then echo "::notice title=${{ matrix.loader }} datagen diff::$(echo "$d" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi

      - name: GameTests (NeoForge)
        # Automated in-game checks, run headless. (Fabric runs its GameTests as part of "build".)
        if: matrix.loader == 'neoforge'
        run: bash ../.github/scripts/gradle-run.sh "neoforge gametests" runGameTestServer

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosegoldequipment-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: ignore
